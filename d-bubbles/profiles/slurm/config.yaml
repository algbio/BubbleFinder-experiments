  run_bf_sb_gfa_noT:
    runtime: 120
    mem_mb: 180000
    cpus_per_task: 2

  run_vg_gbz_T:
    runtime: 120
    mem_mb: 180000
    cpus_per_task: 2
  run_vg_gbz_noT:
    runtime: 120
    mem_mb: 180000
    cpus_per_task: 2
  run_bf_gbz_T:
    runtime: 120
    mem_mb: 180000
    cpus_per_task: 2
  run_bf_gbz_noT:
    runtime: 120
    mem_mb: 180000
    cpus_per_task: 2
  d_tables:
    runtime: 120
